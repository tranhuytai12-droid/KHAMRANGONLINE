<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Phòng khám 3D Thúy Đức</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: canvas 3D phủ toàn màn hình; giao diện nổi lên trên: màn tạo nhân vật (khung trượt từ dưới), HUD khi đi trong phòng khám 2 tầng, khung thông tin từng khu */
:root {
  --bg: #DCEFEC;
  --sheet: #FFFFFF;
  --soft: #EEF6F5;
  --ink: #0E2A33;
  --muted: #557079;
  --line: #D3E3E1;
  --teal: #0F7C86;
  --gum: #D9536F;
  --gum-soft: #FBE6EB;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1E22; --sheet: #12292F; --soft: #183439; --ink: #E6F0F2; --muted: #93AEB5;
    --line: #24434A; --teal: #4FC3CB; --gum: #F08AA0; --gum-soft: #3A1E27; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1E22; --sheet: #12292F; --soft: #183439; --ink: #E6F0F2; --muted: #93AEB5;
  --line: #24434A; --teal: #4FC3CB; --gum: #F08AA0; --gum-soft: #3A1E27; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 80% at 50% 20%, var(--soft), var(--bg));
  color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55;
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.1; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 999px; padding: 13px 22px; font-weight: 700;
  background: var(--gum); color: #fff; box-shadow: 0 10px 24px -12px var(--gum);
}
.btn.soft { background: var(--soft); color: var(--ink); box-shadow: none; }
.btn[disabled] { opacity: .45; cursor: default; }
.side { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- Màn tạo nhân vật ---------- */
#intro { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
#intro .brand { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 0; right: 0; text-align: center; display: flex; flex-direction: column; gap: 4px; }
#intro .brand b { font: 800 22px var(--display); }
#intro .brand span { font-size: 13px; color: var(--muted); }
.sheet {
  pointer-events: auto; background: var(--sheet); border-radius: 26px 26px 0 0;
  width: 100%; max-width: 560px; margin: 0 auto;
  padding-block: 22px calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 -20px 40px -24px rgba(14,42,51,.35);
  max-height: 62vh; overflow-y: auto;
}
.sheet h2 { font-size: 22px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
input, select, textarea {
  font: 15px var(--body); color: var(--ink); background: var(--soft);
  border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; width: 100%; min-width: 0;
}
.row input { flex: 1; }
.chip { border: 1.5px solid var(--line); background: var(--soft); border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--sheet); box-shadow: 0 0 0 1.5px var(--line); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--teal); }
#enter { width: 100%; margin-top: 4px; font-size: 16px; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
.top {
  position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
}
.top .right { display: flex; gap: 8px; }
.pill {
  pointer-events: auto; background: var(--sheet); border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 20px -14px rgba(0,0,0,.4);
}
.pill b { font-family: var(--display); font-size: 15px; }
.pill small { color: var(--muted); font-size: 12px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gum); flex: none; }
#goMenu {
  pointer-events: auto; position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 60px);
  background: var(--sheet); border: 1px solid var(--line); border-radius: 18px; padding: 6px; width: 240px;
  display: flex; flex-direction: column; box-shadow: 0 18px 40px -20px rgba(0,0,0,.45);
  max-height: calc(100vh - 120px); overflow-y: auto;
}
#goMenu h4 { margin: 8px 12px 2px; font: 600 11px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--teal); }
#goMenu button { text-align: left; background: none; border: 0; border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; }
#goMenu button:hover { background: var(--soft); }
#goMenu small { color: var(--muted); font-size: 12px; }
.hint {
  position: absolute; top: calc(env(safe-area-inset-top, 0px) + 66px); left: 50%; transform: translateX(-50%);
  background: rgba(14,42,51,.82); color: #fff; font-size: 13px; padding: 8px 14px; border-radius: 999px;
  white-space: nowrap; transition: opacity .6s; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
}
#prompt {
  pointer-events: auto; position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  display: flex; align-items: center; gap: 12px; background: var(--sheet); border: 1.5px solid var(--gum);
  border-radius: 999px; padding: 8px 8px 8px 18px; box-shadow: 0 14px 30px -16px rgba(0,0,0,.5); max-width: calc(100% - 32px);
}
#prompt span { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#prompt kbd { font: 600 11px var(--body); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--muted); }
#prompt .btn { padding: 9px 16px; }
@media (pointer: coarse) { #prompt kbd { display: none; } }
.bubble {
  position: absolute; transform: translate(-50%, -100%); background: var(--sheet); color: var(--ink);
  border-radius: 14px; padding: 8px 12px; font-size: 13px; max-width: 220px; text-align: center;
  box-shadow: 0 10px 24px -14px rgba(0,0,0,.5); border: 1px solid var(--line);
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px; background: var(--sheet); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: translateX(-50%) rotate(45deg); }
.bubble b { color: var(--teal); display: block; font-size: 12px; }
#joy {
  pointer-events: auto; position: absolute; left: max(20px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
  width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.55); border: 1.5px solid rgba(14,42,51,.15); touch-action: none;
}
#joy i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: var(--gum); box-shadow: 0 6px 14px -6px rgba(0,0,0,.4); }
@media (pointer: fine) { #joy { display: none; } }
#zoomBtns { pointer-events: auto; position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 42%; display: flex; flex-direction: column; gap: 10px; }
#zoomBtns button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); font-size: 20px; line-height: 1; box-shadow: 0 8px 20px -14px rgba(0,0,0,.4); }
#fade { position: fixed; inset: 0; background: #0E2A33; opacity: 0; pointer-events: none; transition: opacity .35s; display: grid; place-items: center; color: #fff; font: 800 28px var(--display); }
#fade.on { opacity: 1; }

/* ---------- Khung thông tin khu ---------- */
#panel { position: fixed; inset: auto 0 0 0; display: flex; justify-content: center; pointer-events: none; }
#panel .sheet { max-height: 70vh; gap: 16px; }
#panel header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
#panel .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--teal); font-weight: 600; }
#panel h2 { font-size: 24px; margin-top: 4px; }
#panel a { color: var(--teal); }
#close { border: 0; background: var(--soft); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; flex: none; }
.list { display: flex; flex-direction: column; gap: 10px; }
.item { display: flex; gap: 12px; padding: 12px 14px; background: var(--soft); border-radius: 16px; }
.item b { display: block; }
.item p { color: var(--muted); font-size: 14px; }
.item .n { font: 800 18px var(--display); color: var(--gum); min-width: 22px; }
.item .n.y { font-size: 15px; min-width: 42px; color: var(--teal); }
.lead { color: var(--muted); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form .full { grid-column: 1 / -1; }
.form label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); min-width: 0; }
@media (max-width: 460px) { .form { grid-template-columns: 1fr; } }
.ok { color: var(--teal); font-size: 14px; }
.quad { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quad div { background: var(--gum-soft); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; }
.quad span { font-size: 13px; color: var(--muted); }
.tbl { overflow-x: auto; }
.tbl table { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl caption { text-align: left; font: 600 16px var(--display); padding: 4px 0 6px; }
.tbl td { padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top; }
.tbl td.num { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; font-weight: 600; }
.tbl td.nt { color: var(--muted); font-size: 12.5px; }
.lift { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lift .btn { flex-direction: column; gap: 2px; padding: 16px; }
.lift .btn small { font-weight: 500; opacity: .85; }
.todo { font-size: 13px; color: var(--muted); }
.send { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; background: var(--soft); border: 1.5px solid var(--line); }
.send h3 { font-size: 18px; }
.drop { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 18px 12px; border: 2px dashed var(--teal); border-radius: 16px; background: var(--sheet); text-align: center; cursor: pointer; }
.drop.over { background: var(--gum-soft); border-color: var(--gum); }
.drop b { color: var(--teal); }
.drop small { color: var(--muted); font-size: 12.5px; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.thumbs:empty { display: none; }
.thumb { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--sheet); border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; color: var(--muted); text-align: center; padding: 4px; word-break: break-all; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.thumb button { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(14,42,51,.75); color: #fff; font-size: 13px; line-height: 1; padding: 0; }
.zalo { background: #0068FF; box-shadow: 0 10px 24px -12px #0068FF; }
.steps { margin: 0; padding-left: 20px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
dl.info { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
dl.info dt { color: var(--muted); }
dl.info dd { margin: 0; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .hint, #fade { transition: none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Phòng khám nha khoa 3D hai tầng"></canvas>
<div id="loading">Đang dựng phòng khám…</div>

<!-- Màn tạo nhân vật -->
<div id="intro" hidden>
  <div class="brand"><b>Nha khoa Thúy Đức</b><span>Tham quan Thúy Đức Premium 3D · tầng 3 &amp; tầng 4, 257 Giải Phóng</span></div>
  <div class="sheet side">
    <h2>Tạo nhân vật</h2>
    <label class="field"><span>Tên hiển thị</span>
      <div class="row"><input id="nameIn" maxlength="24" autocomplete="off"><button class="chip" id="randName" type="button">Gợi ý tên</button></div>
    </label>
    <div class="field"><span>Giới tính</span>
      <div class="row" id="genderRow">
        <button class="chip" type="button" data-g="m" aria-pressed="true">Nam</button>
        <button class="chip" type="button" data-g="f" aria-pressed="false">Nữ</button>
      </div>
    </div>
    <div class="field"><span>Màu áo</span><div class="row" id="shirtRow"></div></div>
    <div class="field"><span>Màu tóc</span><div class="row" id="hairRow"></div></div>
    <button class="btn" id="enter" type="button">Vào phòng khám</button>
  </div>
</div>

<!-- HUD -->
<div id="hud" hidden>
  <div class="top side">
    <div class="pill"><span class="dot"></span><div><b id="hudName">Khách</b><br><small id="hudZone">Tầng 3 · Sảnh</small></div></div>
    <div class="right">
      <button class="pill" id="floorBtn" type="button"><b>Lên tầng 4</b></button>
      <button class="pill" id="goBtn" type="button" aria-expanded="false"><b>Đi tới</b></button>
    </div>
  </div>
  <div id="goMenu" hidden></div>
  <div class="hint" id="hint">WASD để đi · kéo để xoay góc nhìn · chạm sàn để tự đi tới · thang máy để đổi tầng</div>
  <div id="zoomBtns"><button type="button" id="zIn" aria-label="Phóng to">+</button><button type="button" id="zOut" aria-label="Thu nhỏ">−</button></div>
  <div id="bubbles"></div>
  <div id="prompt" hidden><span id="promptText"></span><kbd>E</kbd><button class="btn" id="promptBtn" type="button">Xem</button></div>
  <div id="joy" aria-hidden="true"><i></i></div>
</div>

<div id="panel" hidden>
  <div class="sheet side" role="dialog" aria-modal="false" aria-labelledby="pTitle">
    <header><div><div class="eyebrow" id="pEyebrow"></div><h2 id="pTitle"></h2></div><button id="close" type="button" aria-label="Đóng">✕</button></header>
    <div id="pBody" class="list"></div>
  </div>
</div>
<div id="fade" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!window.THREE) { $('loading').textContent = 'Không tải được thư viện 3D. Kiểm tra kết nối mạng rồi tải lại trang.'; return; }
  try { await document.fonts.ready; } catch (e) {}

  /* ================= Renderer ================= */
  const canvas = $('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 120);
  function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();
  const mat = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.6 }, o));

  /* ================= Nhân vật chibi ================= */
  function makeChibi(o) {
    const g = new THREE.Group();
    const skin = mat(o.skin || 0xf6d2b8, { roughness: 0.7 });
    const add = (geo, m, x, y, z, parent = g) => { const me = new THREE.Mesh(geo, m); me.position.set(x, y, z); me.castShadow = true; parent.add(me); return me; };
    const legGeo = new THREE.CylinderGeometry(0.11, 0.1, 0.36, 12); legGeo.translate(0, -0.18, 0);
    const shoeGeo = new THREE.SphereGeometry(0.12, 12, 8); shoeGeo.scale(1, 0.6, 1.4);
    const legs = [-0.13, 0.13].map(x => {
      const pivot = new THREE.Group(); pivot.position.set(x, 0.42, 0); g.add(pivot);
      add(legGeo, mat(o.pants), 0, 0, 0, pivot); add(shoeGeo, mat(0x2d3a40), 0, -0.38, 0.04, pivot);
      return pivot;
    });
    const body = add(new THREE.CylinderGeometry(0.24, 0.34, 0.56, 20), mat(o.shirt), 0, 0.7, 0);
    if (o.coat) {
      add(new THREE.CylinderGeometry(0.255, 0.37, 0.62, 20, 1, true), mat(0xffffff, { side: THREE.DoubleSide }), 0, 0.66, 0);
      const st = add(new THREE.TorusGeometry(0.17, 0.018, 6, 24, Math.PI), mat(0x22313a), 0, 0.9, 0.17); st.rotation.z = Math.PI; st.rotation.x = -0.3;
    }
    if (o.scarf) { const sc = add(new THREE.TorusGeometry(0.16, 0.04, 8, 20), mat(0xf2a33a), 0, 0.98, 0); sc.rotation.x = Math.PI / 2; }
    const armGeo = new THREE.CylinderGeometry(0.075, 0.07, 0.34, 10); armGeo.translate(0, -0.17, 0);
    const handGeo = new THREE.SphereGeometry(0.08, 10, 8);
    const arms = [-1, 1].map(s => {
      const pivot = new THREE.Group(); pivot.position.set(0.3 * s, 0.93, 0); pivot.rotation.z = 0.22 * s; g.add(pivot);
      add(armGeo, mat(o.coat ? 0xffffff : o.shirt), 0, 0, 0, pivot); add(handGeo, skin, 0, -0.37, 0, pivot);
      return pivot;
    });
    const head = new THREE.Group(); head.position.y = 1.36; g.add(head);
    add(new THREE.SphereGeometry(0.42, 32, 24), skin, 0, 0, 0, head);
    const eyeGeo = new THREE.SphereGeometry(0.058, 12, 10), eyeM = mat(0x1d2326, { roughness: 0.2 });
    const glint = new THREE.SphereGeometry(0.018, 8, 6), glintM = new THREE.MeshBasicMaterial({ color: 0xffffff });
    [-1, 1].forEach(s => {
      add(eyeGeo, eyeM, 0.14 * s, 0.0, 0.375, head); add(glint, glintM, 0.14 * s + 0.02, 0.025, 0.43, head);
      const bl = add(new THREE.CircleGeometry(0.06, 16), new THREE.MeshBasicMaterial({ color: 0xf29aa8, transparent: true, opacity: 0.6 }), 0.25 * s, -0.09, 0.335, head);
      bl.rotation.y = 0.55 * s; bl.castShadow = false;
    });
    add(new THREE.TorusGeometry(0.05, 0.013, 6, 14, Math.PI), mat(0x9b3a46), 0, -0.13, 0.4, head).rotation.z = Math.PI;
    const hairM = mat(o.hair, { roughness: 0.5 });
    add(new THREE.SphereGeometry(0.445, 32, 20, 0, Math.PI * 2, 0, Math.PI * 0.52), hairM, 0, 0.02, -0.02, head).rotation.x = -0.32;
    if (o.female) {
      add(new THREE.SphereGeometry(0.44, 24, 18), hairM, 0, -0.12, -0.1, head).scale.set(1.02, 1.25, 0.9);
      add(new THREE.SphereGeometry(0.15, 16, 12), hairM, 0, 0.42, -0.22, head);
    } else add(new THREE.SphereGeometry(0.12, 12, 10), hairM, 0.16, 0.3, 0.28, head).scale.set(1.3, 0.7, 0.8);
    if (o.mask) add(new THREE.SphereGeometry(0.43, 24, 12, -0.9 + Math.PI / 2, 1.8, Math.PI * 0.55, Math.PI * 0.22), mat(0x9fd8dc), 0, 0, 0.005, head);
    return { group: g, legs, arms, body, head };
  }
  function animateChibi(c, phase, amt, t) {
    const s = Math.sin(phase) * 0.7 * amt;
    c.legs[0].rotation.x = s; c.legs[1].rotation.x = -s;
    c.arms[0].rotation.x = -s * 0.8; c.arms[1].rotation.x = s * 0.8;
    c.body.position.y = 0.7 + Math.abs(Math.cos(phase)) * 0.04 * amt;
    c.head.position.y = 1.36 + Math.abs(Math.cos(phase)) * 0.05 * amt + (reduce ? 0 : Math.sin(t * 2) * 0.012 * (1 - amt));
  }

  /* ================= Răng 16 (mô hình) ================= */
  function makeTooth() {

  const blockedAt = (i, j) => i < 0 || j < 0 || i >= GX || j >= GZ || grid[j * GX + i] === 1;
  function buildGrid() {
    grid = new Uint8Array(GX * GZ); const m = R + 0.04;
    for (let j = 0; j < GZ; j++) for (let i = 0; i < GX; i++) {
      const x = -W + (i + 0.5) * CELL, z = -D + (j + 0.5) * CELL;
      if (x < -W + 0.15 + m || x > W - 0.15 - m || z < -D + 0.15 + m || z > D - 0.15 - m) { grid[j * GX + i] = 1; continue; }
      for (const o of obstacles) if (x > o.x0 - m && x < o.x1 + m && z > o.z0 - m && z < o.z1 + m) { grid[j * GX + i] = 1; break; }
    }
  }
  function lineFree(ax, az, bx, bz) {
    const n = Math.ceil(Math.hypot(bx - ax, bz - az) / 0.15);
    for (let k = 1; k <= n; k++) { const [i, j] = cellOf(ax + (bx - ax) * k / n, az + (bz - az) * k / n); if (blockedAt(i, j)) return false; }
    return true;
  }
  function findPath(sx, sz, tx, tz) {
    if (!grid) buildGrid();
    let [ti, tj] = cellOf(tx, tz);
    if (blockedAt(ti, tj)) {
      let best = -1, bd = Infinity;
      for (let k = 0; k < grid.length; k++) if (!grid[k]) { const d = (k % GX - ti) ** 2 + (((k / GX) | 0) - tj) ** 2; if (d < bd) { bd = d; best = k; } }
      if (best < 0) return [];
      ti = best % GX; tj = (best / GX) | 0; const p = cellPt(best); tx = p.x; tz = p.z;
    }
    const end = new THREE.Vector3(tx, 0, tz);
    if (lineFree(sx, sz, tx, tz)) return [end];
    const [si0, sj0] = cellOf(sx, sz), si = Math.max(0, Math.min(GX - 1, si0)), sj = Math.max(0, Math.min(GZ - 1, sj0));
    const N = GX * GZ, g = new Float32Array(N).fill(Infinity), f = new Float32Array(N).fill(Infinity);
    const came = new Int32Array(N).fill(-1), closed = new Uint8Array(N);
    const start = sj * GX + si, goal = tj * GX + ti, h = k => Math.hypot(k % GX - ti, ((k / GX) | 0) - tj);
    g[start] = 0; f[start] = h(start); const open = [start];
    while (open.length) {
      let bi = 0; for (let k = 1; k < open.length; k++) if (f[open[k]] < f[open[bi]]) bi = k;
      const c = open.splice(bi, 1)[0];
      if (c === goal) break;
      if (closed[c]) continue; closed[c] = 1;
      const ci = c % GX, cj = (c / GX) | 0;
      for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
        if (!di && !dj) continue;
        const ni = ci + di, nj = cj + dj;
        if (blockedAt(ni, nj) || (di && dj && (blockedAt(ci + di, cj) || blockedAt(ci, cj + dj)))) continue;
        const nk = nj * GX + ni, ng = g[c] + (di && dj ? 1.414 : 1);
        if (ng < g[nk]) { g[nk] = ng; f[nk] = ng + h(nk); came[nk] = c; open.push(nk); }
      }
    }
    if (came[goal] === -1) return [end];
    const pts = [];
    for (let k = goal; k !== -1 && k !== start; k = came[k]) pts.unshift(cellPt(k));
    pts[pts.length - 1] = end;
    const out = []; let ax = sx, az = sz, idx = 0;
    while (idx < pts.length) {
      let far = idx;
      for (let k = pts.length - 1; k > idx; k--) if (lineFree(ax, az, pts[k].x, pts[k].z)) { far = k; break; }
      out.push(pts[far]); ax = pts[far].x; az = pts[far].z; idx = far + 1;
    }
    return out;
  }
  function goTo(x, z) {
    const pos = player.group.position;
    path = findPath(pos.x, pos.z, x, z); target = path.shift() || null;
    const last = path.length ? path[path.length - 1] : target;
    if (last) { marker.position.set(last.x, 0.02, last.z); marker.visible = true; }
  }

  /* ================= Vòng lặp ================= */
  const SPEED = 4.6, tmp = new THREE.Vector3(), lookAt = new THREE.Vector3();
  let phase = 0, walk = 0, last = performance.now(), stuck = 0;
  $('loading').hidden = true; $('intro').hidden = false;

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;
    if (mode === 'intro') {
      const h = innerHeight, sheetH = document.querySelector('#intro .sheet').offsetHeight;
      const free = Math.max(160, h - sheetH - 70), dist = Math.min(14, 2.1 * h / (0.828 * free * 0.85));
      camera.setViewOffset(innerWidth, h, 0, (sheetH - 50) / 2, innerWidth, h);
      camera.position.set(0, 0.85 + dist * 0.12, dist); camera.lookAt(0, 0.85, 0);
      if (!reduce && pDrag === null) previewSpin += dt * 0.4;
      player.group.rotation.y = previewSpin; animateChibi(player, t * 2, 0, t);
      renderer.render(preview, camera); requestAnimationFrame(frame); return;
    }
    const g = player.group, pos = g.position;
    let mx = 0, mz = 0;
    if (!openZone || !document.activeElement || !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
      mx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
      mz = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
    }
    if (joy.id !== null) { mx = joy.x; mz = joy.y; }
    if (mx || mz) {
      const c = Math.cos(camYaw), s = Math.sin(camYaw), wx = mx * c + mz * s, wz = -mx * s + mz * c;
      mx = wx; mz = wz; target = null; path = []; marker.visible = false;
    } else if (target) {
      const dx = target.x - pos.x, dz = target.z - pos.z, d = Math.hypot(dx, dz);
      if (d < (path.length ? 0.35 : 0.15)) { target = path.shift() || null; if (!target) marker.visible = false; }
      else { mx = dx / d; mz = dz / d; }
    }
    const len = Math.hypot(mx, mz);
    let moving = false;
    if (len > 0.08) {
      const s = Math.min(1, len); mx /= len; mz /= len;
      const bx = pos.x, bz = pos.z;
      pos.x += mx * SPEED * s * dt; pos.z += mz * SPEED * s * dt; collide(pos);
      if (target && Math.hypot(pos.x - bx, pos.z - bz) < SPEED * s * dt * 0.2) { stuck += dt; if (stuck > 0.4) { target = null; path = []; marker.visible = false; stuck = 0; } } else stuck = 0;
      const want = Math.atan2(mx, mz), c0 = g.rotation.y;
      g.rotation.y = c0 + Math.atan2(Math.sin(want - c0), Math.cos(want - c0)) * Math.min(1, dt * 12);
      phase += dt * 11 * s; moving = true;
    }
    walk += ((moving ? 1 : 0) - walk) * Math.min(1, dt * 10);
    animateChibi(player, phase, walk, t);
    cur.npcs.forEach((c, i) => animateChibi(c, 0, 0, t + i));
    zones.forEach(z => {
      z.ring.material.opacity = 0.35 + 0.25 * Math.sin(t * 3);
      if (!z.npc) return;
      const c = z.npc.group, dx = pos.x - c.position.x, dz = pos.z - c.position.z;
      const want = Math.hypot(dx, dz) < 5 ? Math.atan2(dx, dz) : z.npc.base, r0 = c.rotation.y;
      c.rotation.y = r0 + Math.atan2(Math.sin(want - r0), Math.cos(want - r0)) * Math.min(1, dt * 4);
    });
    if (marker.visible) marker.scale.setScalar(1 + 0.15 * Math.sin(t * 8));
    if (!reduce) tooth.rotation.y += dt * 0.6;

    // camera ngôi thứ ba thấp sau lưng nhân vật
    const cd = 5.4 * zoom, ch = (1.2 + 2.4 * camPitch) * zoom;
    tmp.set(pos.x + Math.sin(camYaw) * cd, ch, pos.z + Math.cos(camYaw) * cd);
    tmp.x = Math.max(-W + 0.4, Math.min(W - 0.4, tmp.x)); tmp.z = Math.max(-D + 0.4, Math.min(D - 0.4, tmp.z)); tmp.y = Math.min(CEIL - 0.4, tmp.y);
    camera.position.lerp(tmp, 1 - Math.exp(-dt * 6));
    lookAt.set(pos.x - Math.sin(camYaw) * 2.2, 1.25, pos.z - Math.cos(camYaw) * 2.2);
    camera.lookAt(lookAt);
    signs.forEach(s => { s.material.opacity = Math.max(0, Math.min(1, (s.position.distanceTo(camera.position) - 3.5) / 3)); });

    let best = null, bd = 2.2;
    zones.forEach(z => { const d = Math.hypot(pos.x - z.pos[0], pos.z - z.pos[1]); if (d < bd) { bd = d; best = z; } });
    if (best !== near) { near = best; $('hudZone').textContent = `Tầng ${cur.n} · ${near ? near.name : 'Sảnh'}`; if (!near && openZone) closePanel(); }
    $('prompt').hidden = !near || !!openZone;
    if (near && !openZone) $('promptText').textContent = `${near.name} · ${near.sub}`;

    renderer.render(world, camera);
    bubbles.forEach(({ z, el }) => {
      const c = z.npc.group.position, show = z.floor === cur.n && Math.hypot(pos.x - c.x, pos.z - c.z) < 4.5 && !openZone;
      el.hidden = !show; if (!show) return;
      tmp.set(c.x, 2.1, c.z).project(camera);
      el.style.left = (tmp.x * 0.5 + 0.5) * innerWidth + 'px'; el.style.top = (-tmp.y * 0.5 + 0.5) * innerHeight + 'px';
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
