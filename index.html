<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nha khoa Thúy Đức Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: canvas 3D phủ toàn màn hình; giao diện nổi lên trên: màn tạo nhân vật (khung trượt từ dưới), HUD khi đi trong phòng khám 2 tầng, khung thông tin từng khu */
:root {
  --bg: #DCEFEC;
  --sheet: #FFFFFF;
  --soft: #EEF6F5;
  --ink: #0E2A33;
  --muted: #557079;
  --line: #D3E3E1;
  --teal: #0F7C86;
  --gum: #D9536F;
  --gum-soft: #FBE6EB;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1E22; --sheet: #12292F; --soft: #183439; --ink: #E6F0F2; --muted: #93AEB5;
    --line: #24434A; --teal: #4FC3CB; --gum: #F08AA0; --gum-soft: #3A1E27; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1E22; --sheet: #12292F; --soft: #183439; --ink: #E6F0F2; --muted: #93AEB5;
  --line: #24434A; --teal: #4FC3CB; --gum: #F08AA0; --gum-soft: #3A1E27; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 80% at 50% 20%, var(--soft), var(--bg));
  color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55;
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.1; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 999px; padding: 13px 22px; font-weight: 700;
  background: var(--gum); color: #fff; box-shadow: 0 10px 24px -12px var(--gum);
}
.btn.soft { background: var(--soft); color: var(--ink); box-shadow: none; }
.btn[disabled] { opacity: .45; cursor: default; }
.side { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- Màn tạo nhân vật ---------- */
#intro { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
#intro .brand { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 0; right: 0; text-align: center; display: flex; flex-direction: column; gap: 4px; }
#intro .brand b { font: 800 22px var(--display); }
#intro .brand span { font-size: 13px; color: var(--muted); }
.sheet {
  pointer-events: auto; background: var(--sheet); border-radius: 26px 26px 0 0;
  width: 100%; max-width: 560px; margin: 0 auto;
  padding-block: 22px calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 -20px 40px -24px rgba(14,42,51,.35);
  max-height: 62vh; overflow-y: auto;
}
.sheet h2 { font-size: 22px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
input, select, textarea {
  font: 15px var(--body); color: var(--ink); background: var(--soft);
  border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; width: 100%; min-width: 0;
}
.row input { flex: 1; }
.chip { border: 1.5px solid var(--line); background: var(--soft); border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--sheet); box-shadow: 0 0 0 1.5px var(--line); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--teal); }
#enter { width: 100%; margin-top: 4px; font-size: 16px; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
.top {
  position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
}
.top .right { display: flex; gap: 8px; }
.pill {
  pointer-events: auto; background: var(--sheet); border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 20px -14px rgba(0,0,0,.4);
}
.pill b { font-family: var(--display); font-size: 15px; }
.pill small { color: var(--muted); font-size: 12px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gum); flex: none; }
#goMenu {
  pointer-events: auto; position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 60px);
  background: var(--sheet); border: 1px solid var(--line); border-radius: 18px; padding: 6px; width: 240px;
  display: flex; flex-direction: column; box-shadow: 0 18px 40px -20px rgba(0,0,0,.45);
  max-height: calc(100vh - 120px); overflow-y: auto;
}
#goMenu h4 { margin: 8px 12px 2px; font: 600 11px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--teal); }
#goMenu button { text-align: left; background: none; border: 0; border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; }
#goMenu button:hover { background: var(--soft); }
#goMenu small { color: var(--muted); font-size: 12px; }
.hint {
  position: absolute; top: calc(env(safe-area-inset-top, 0px) + 66px); left: 50%; transform: translateX(-50%);
  background: rgba(14,42,51,.82); color: #fff; font-size: 13px; padding: 8px 14px; border-radius: 999px;
  white-space: nowrap; transition: opacity .6s; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
}
#prompt {
  pointer-events: auto; position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  display: flex; align-items: center; gap: 12px; background: var(--sheet); border: 1.5px solid var(--gum);
  border-radius: 999px; padding: 8px 8px 8px 18px; box-shadow: 0 14px 30px -16px rgba(0,0,0,.5); max-width: calc(100% - 32px);
}
#prompt span { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#prompt kbd { font: 600 11px var(--body); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--muted); }
#prompt .btn { padding: 9px 16px; }
@media (pointer: coarse) { #prompt kbd { display: none; } }
.bubble {
  position: absolute; transform: translate(-50%, -100%); background: var(--sheet); color: var(--ink);
  border-radius: 14px; padding: 8px 12px; font-size: 13px; max-width: 220px; text-align: center;
  box-shadow: 0 10px 24px -14px rgba(0,0,0,.5); border: 1px solid var(--line);
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px; background: var(--sheet); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: translateX(-50%) rotate(45deg); }
.bubble b { color: var(--teal); display: block; font-size: 12px; }
.tag { position: absolute; transform: translate(-50%, -100%); background: rgba(14,42,51,.78); color: #fff; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; pointer-events: none; }
#hudOnline { color: var(--teal); font-weight: 600; }
#fight { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); display: flex; flex-direction: column; align-items: flex-end; gap: 10px; pointer-events: none; }
#fight .hp { pointer-events: auto; background: var(--sheet); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px; display: flex; align-items: center; gap: 8px; width: 200px; font-size: 13px; }
#fight .hp i { flex: 1; height: 10px; border-radius: 999px; background: var(--soft); overflow: hidden; }
#fight .hp span { display: block; height: 100%; width: 100%; background: var(--gum); transition: width .15s; }
#fight .moves { display: flex; gap: 10px; pointer-events: auto; }
#fight .moves button { width: 70px; height: 70px; border-radius: 50%; border: 0; background: var(--gum); color: #fff; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 10px 24px -12px rgba(0,0,0,.6); touch-action: none; user-select: none; -webkit-user-select: none; }
#fight .moves button[hidden] { display: none; }
#fight .moves #mvBlock { background: var(--ink); color: var(--sheet); }
#fight .moves button[aria-pressed="true"] { outline: 3px solid var(--teal); outline-offset: 2px; }
#fight kbd { font: 600 10px var(--body); opacity: .8; }
@media (pointer: coarse) { #fight kbd { display: none; } }
#toast { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 112px); transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 10px 18px; border-radius: 999px; font-weight: 700; max-width: calc(100% - 32px); text-align: center; }
#hurt { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px 30px rgba(217,40,60,.75); opacity: 0; transition: opacity .35s; }
#hurt.on { opacity: 1; transition: none; }
.stars { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.stars button { border: 0; background: none; padding: 0 3px; font-size: 38px; line-height: 1; color: var(--line); }
.stars button[aria-pressed="true"] { color: #F5B301; }
.stars span { margin-left: 8px; color: var(--muted); font-size: 14px; font-weight: 600; }
a.btn.gmap { background: #1a73e8; color: #fff !important; text-decoration: none; box-shadow: none; align-self: flex-start; }
.tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tracks .chip { display: flex; flex-direction: column; align-items: flex-start; text-align: left; border-radius: 14px; padding: 9px 12px; }
.tracks .chip small { font-weight: 500; font-size: 12px; opacity: .75; }
.drinks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.drink { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 10px 12px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--soft); }
.drink:hover { border-color: var(--gum); }
.drink .dot { width: 22px; height: 22px; border-radius: 50%; margin-bottom: 4px; box-shadow: inset 0 -5px 0 rgba(0,0,0,.18); }
.drink b { font-size: 14px; line-height: 1.3; }
.drink small { color: var(--muted); font-size: 12px; line-height: 1.35; }
.drink em { font-style: normal; color: var(--gum); font-weight: 700; font-size: 12.5px; margin-top: 4px; }
body.panel-open #club, body.panel-open #fight { display: none; }
@media (max-width: 600px) { body #club, body #fight { bottom: calc(env(safe-area-inset-bottom, 0px) + 86px); } } /* chừa chỗ cho thanh "Xem" ở đáy */
#club { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); display: flex; gap: 10px; pointer-events: auto; }
#club button { width: 70px; height: 70px; border-radius: 50%; border: 0; background: #7b2ff7; color: #fff; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 0 22px -4px #b14dff; }
#club button[aria-pressed="true"] { background: #ff2d95; box-shadow: 0 0 26px -2px #ff2d95; }
#club kbd { font: 600 10px var(--body); opacity: .8; }
@media (pointer: coarse) { #club kbd { display: none; } }
.tag.ko { background: rgba(160,30,50,.85); }
#joy {
  pointer-events: auto; position: absolute; left: max(20px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
  width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.55); border: 1.5px solid rgba(14,42,51,.15); touch-action: none;
}
#joy i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: var(--gum); box-shadow: 0 6px 14px -6px rgba(0,0,0,.4); }
@media (pointer: fine) { #joy { display: none; } }
#zoomBtns { pointer-events: auto; position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 42%; display: flex; flex-direction: column; gap: 10px; }
#zoomBtns button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); font-size: 20px; line-height: 1; box-shadow: 0 8px 20px -14px rgba(0,0,0,.4); }
#fade { position: fixed; inset: 0; background: #0E2A33; opacity: 0; pointer-events: none; transition: opacity .35s; display: grid; place-items: center; color: #fff; font: 800 28px var(--display); }
#fade.on { opacity: 1; }

/* ---------- Khung thông tin khu ---------- */
#panel { position: fixed; inset: auto 0 0 0; display: flex; justify-content: center; pointer-events: none; }
#panel .sheet { max-height: 70vh; gap: 16px; }
#panel header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
#panel .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--teal); font-weight: 600; }
#panel h2 { font-size: 24px; margin-top: 4px; }
#panel a { color: var(--teal); }
#close { border: 0; background: var(--soft); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; flex: none; }
.list { display: flex; flex-direction: column; gap: 10px; }
.item { display: flex; gap: 12px; padding: 12px 14px; background: var(--soft); border-radius: 16px; }
.item b { display: block; }
.item p { color: var(--muted); font-size: 14px; }
.item .n { font: 800 18px var(--display); color: var(--gum); min-width: 22px; }
.item .n.y { font-size: 15px; min-width: 42px; color: var(--teal); }
.lead { color: var(--muted); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form .full { grid-column: 1 / -1; }
.form label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); min-width: 0; }
@media (max-width: 460px) { .form { grid-template-columns: 1fr; } }
.ok { color: var(--teal); font-size: 14px; }
.quad { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quad div { background: var(--gum-soft); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; }
.quad span { font-size: 13px; color: var(--muted); }
.tbl { overflow-x: auto; }
.tbl table { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl caption { text-align: left; font: 600 16px var(--display); padding: 4px 0 6px; }
.tbl td { padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top; }
.tbl td.num { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; font-weight: 600; }
.tbl td.nt { color: var(--muted); font-size: 12.5px; }
.lift { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lift .btn { flex-direction: column; gap: 2px; padding: 16px; }
.lift .btn small { font-weight: 500; opacity: .85; }
.todo { font-size: 13px; color: var(--muted); }
.send { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; background: var(--soft); border: 1.5px solid var(--line); }
.send h3 { font-size: 18px; }
.drop { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 18px 12px; border: 2px dashed var(--teal); border-radius: 16px; background: var(--sheet); text-align: center; cursor: pointer; }
.drop.over { background: var(--gum-soft); border-color: var(--gum); }
.drop b { color: var(--teal); }
.drop small { color: var(--muted); font-size: 12.5px; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.thumbs:empty { display: none; }
.thumb { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--sheet); border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; color: var(--muted); text-align: center; padding: 4px; word-break: break-all; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.thumb button { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(14,42,51,.75); color: #fff; font-size: 13px; line-height: 1; padding: 0; }
.zalo { background: #0068FF; box-shadow: 0 10px 24px -12px #0068FF; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips .chip { font-size: 13px; padding: 6px 12px; }
.arts { display: flex; flex-direction: column; gap: 8px; }
a.art { display: block; padding: 11px 14px; background: var(--soft); border-radius: 14px; text-decoration: none; color: var(--ink) !important; border: 1.5px solid transparent; }
a.art:hover { border-color: var(--teal); }
a.art b { display: block; font-size: 14.5px; line-height: 1.35; }
a.art small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 3px; }
a.art em { font-style: normal; color: var(--teal); font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.doc { display: flex; flex-direction: column; text-align: left; padding: 0; border: 1.5px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--soft); }
.doc[aria-expanded="true"] { border-color: var(--teal); }
.doc .ph { position: relative; aspect-ratio: 4 / 3; background: var(--gum-soft); display: grid; place-items: center; }
.doc .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.doc .ph i { font: 800 30px var(--display); color: var(--gum); font-style: normal; }
.doc .dn { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; }
.doc .dn b { font-size: 14px; line-height: 1.3; }
.doc .dn small { color: var(--muted); font-size: 12px; line-height: 1.35; }
.doc .dn em { font-style: normal; color: var(--teal); font-size: 11.5px; font-weight: 600; }
.docd { grid-column: 1 / -1; background: var(--sheet); border: 1.5px solid var(--teal); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.docd header b { display: block; font: 700 17px var(--display); }
.docd header small { color: var(--muted); }
.docd blockquote { margin: 0; padding-left: 10px; border-left: 3px solid var(--gum); color: var(--muted); font-style: italic; }
.docd ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.cases .ph { aspect-ratio: 640 / 520; }
.cases .ph img { object-position: center; }
.docd img.big { width: 100%; border-radius: 12px; display: block; }
.chip small { opacity: .6; font-weight: 500; }
#case-more { align-self: center; }
.steps { margin: 0; padding-left: 20px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
dl.info { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
dl.info dt { color: var(--muted); }
dl.info dd { margin: 0; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .hint, #fade { transition: none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Phòng khám nha khoa 3D hai tầng"></canvas>
<div id="loading">Đang dựng phòng khám…</div>

<!-- Màn tạo nhân vật -->
<div id="intro" hidden>
  <div class="brand"><b>Nha khoa Thúy Đức Premium</b><span>Tham quan 3D · tầng 3 &amp; tầng 4, 257 Giải Phóng</span></div>
  <div class="sheet side">
    <h2>Tạo nhân vật</h2>
    <label class="field"><span>Tên hiển thị</span>
      <div class="row"><input id="nameIn" maxlength="24" autocomplete="off"><button class="chip" id="randName" type="button">Gợi ý tên</button></div>
    </label>
    <div class="field"><span>Giới tính</span>
      <div class="row" id="genderRow">
        <button class="chip" type="button" data-g="m" aria-pressed="true">Nam</button>
        <button class="chip" type="button" data-g="f" aria-pressed="false">Nữ</button>
      </div>
    </div>
    <div class="field"><span>Màu áo</span><div class="row" id="shirtRow"></div></div>
    <div class="field"><span>Màu tóc</span><div class="row" id="hairRow"></div></div>
    <button class="btn" id="enter" type="button">Vào phòng khám</button>
  </div>
</div>

<!-- HUD -->
<div id="hud" hidden>
  <div class="top side">
    <div class="pill"><span class="dot"></span><div><b id="hudName">Khách</b><br><small id="hudZone">Tầng 3 · Sảnh</small><br><small id="hudOnline" hidden></small></div></div>
    <div class="right">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!window.THREE) { $('loading').textContent = 'Không tải được thư viện 3D. Kiểm tra kết nối mạng rồi tải lại trang.'; return; }
  try { await document.fonts.ready; } catch (e) {}

  /* ================= Renderer ================= */
  const canvas = $('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 120);
  function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();
  const mat = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.6 }, o));

  /* ================= Nhân vật chibi ================= */
  function makeChibi(o) {
    const g = new THREE.Group(); g.rotation.order = 'YXZ'; // ngã theo hướng mặt khi bị hạ gục
    const skin = mat(o.skin || 0xf6d2b8, { roughness: 0.7 });
    const add = (geo, m, x, y, z, parent = g) => { const me = new THREE.Mesh(geo, m); me.position.set(x, y, z); me.castShadow = true; parent.add(me); return me; };
    const legGeo = new THREE.CylinderGeometry(0.11, 0.1, 0.36, 12); legGeo.translate(0, -0.18, 0);
    const shoeGeo = new THREE.SphereGeometry(0.12, 12, 8); shoeGeo.scale(1, 0.6, 1.4);
    const legs = [-0.13, 0.13].map(x => {
      const pivot = new THREE.Group(); pivot.position.set(x, 0.42, 0); g.add(pivot);
      add(legGeo, mat(o.pants), 0, 0, 0, pivot); add(shoeGeo, mat(0x2d3a40), 0, -0.38, 0.04, pivot);
      return pivot;
    });
    const body = add(new THREE.CylinderGeometry(0.24, 0.34, 0.56, 20), mat(o.shirt), 0, 0.7, 0);
    if (o.coat) {
      add(new THREE.CylinderGeometry(0.255, 0.37, 0.62, 20, 1, true), mat(0xffffff, { side: THREE.DoubleSide }), 0, 0.66, 0);
      const st = add(new THREE.TorusGeometry(0.17, 0.018, 6, 24, Math.PI), mat(0x22313a), 0, 0.9, 0.17); st.rotation.z = Math.PI; st.rotation.x = -0.3;
    }
    if (o.scarf) { const sc = add(new THREE.TorusGeometry(0.16, 0.04, 8, 20), mat(0xf2a33a), 0, 0.98, 0); sc.rotation.x = Math.PI / 2; }
    const armGeo = new THREE.CylinderGeometry(0.075, 0.07, 0.34, 10); armGeo.translate(0, -0.17, 0);
    const handGeo = new THREE.SphereGeometry(0.08, 10, 8);
    const arms = [-1, 1].map(s => {
      const pivot = new THREE.Group(); pivot.position.set(0.3 * s, 0.93, 0); pivot.rotation.z = 0.22 * s; g.add(pivot);
      add(armGeo, mat(o.coat ? 0xffffff : o.shirt), 0, 0, 0, pivot); add(handGeo, skin, 0, -0.37, 0, pivot);
      return pivot;
    });
    const head = new THREE.Group(); head.position.y = 1.36; g.add(head);
    add(new THREE.SphereGeometry(0.42, 32, 24), skin, 0, 0, 0, head);
    const eyeGeo = new THREE.SphereGeometry(0.058, 12, 10), eyeM = mat(0x1d2326, { roughness: 0.2 });
    const glint = new THREE.SphereGeometry(0.018, 8, 6), glintM = new THREE.MeshBasicMaterial({ color: 0xffffff });
    [-1, 1].forEach(s => {
      add(eyeGeo, eyeM, 0.14 * s, 0.0, 0.375, head); add(glint, glintM, 0.14 * s + 0.02, 0.025, 0.43, head);
      const bl = add(new THREE.CircleGeometry(0.06, 16), new THREE.MeshBasicMaterial({ color: 0xf29aa8, transparent: true, opacity: 0.6 }), 0.25 * s, -0.09, 0.335, head);
      bl.rotation.y = 0.55 * s; bl.castShadow = false;
    });
    add(new THREE.TorusGeometry(0.05, 0.013, 6, 14, Math.PI), mat(0x9b3a46), 0, -0.13, 0.4, head).rotation.z = Math.PI;
    const hairM = mat(o.hair, { roughness: 0.5 });
    add(new THREE.SphereGeometry(0.445, 32, 20, 0, Math.PI * 2, 0, Math.PI * 0.52), hairM, 0, 0.02, -0.02, head).rotation.x = -0.32;
    if (o.female) {
      add(new THREE.SphereGeometry(0.44, 24, 18), hairM, 0, -0.12, -0.1, head).scale.set(1.02, 1.25, 0.9);
      add(new THREE.SphereGeometry(0.15, 16, 12), hairM, 0, 0.42, -0.22, head);
    } else add(new THREE.SphereGeometry(0.12, 12, 10), hairM, 0.16, 0.3, 0.28, head).scale.set(1.3, 0.7, 0.8);
    if (o.mask) add(new THREE.SphereGeometry(0.43, 24, 12, -0.9 + Math.PI / 2, 1.8, Math.PI * 0.55, Math.PI * 0.22), mat(0x9fd8dc), 0, 0, 0.005, head);
    return { group: g, legs, arms, body, head };
  }
  function animateChibi(c, phase, amt, t) {
    const s = Math.sin(phase) * 0.7 * amt;
    c.legs[0].rotation.x = s; c.legs[1].rotation.x = -s;
    c.arms[0].rotation.x = -s * 0.8; c.arms[1].rotation.x = s * 0.8;
    c.body.position.y = 0.7 + Math.abs(Math.cos(phase)) * 0.04 * amt;
    c.head.position.y = 1.36 + Math.abs(Math.cos(phase)) * 0.05 * amt + (reduce ? 0 : Math.sin(t * 2) * 0.012 * (1 - amt));
  }

  /* ================= Rắn (phòng hiện nguyên hình) ================= */
  // Thân là chuỗi khối cầu nhỏ dần về đuôi, đầu hướng +z như chibi; hàm dưới mở khi cắn
  function makeSnake(color) {
    const g = new THREE.Group(), segs = [], skin = mat(color, { roughness: 0.35 }), belly = mat(0xf6e7b0, { roughness: 0.5 });
    for (let i = 0; i < 14; i++) {
      const r = 0.17 * (1 - i / 17), m = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), i % 3 === 2 ? belly : skin);
      m.position.set(0, r, -i * 0.19); m.castShadow = true; g.add(m); segs.push(m);
    }
    const head = new THREE.Group(); head.position.set(0, 0.2, 0.2); g.add(head);
    const skull = new THREE.Mesh(new THREE.SphereGeometry(0.21, 18, 14), skin); skull.scale.set(1, 0.72, 1.3); skull.castShadow = true; head.add(skull);
    [-1, 1].forEach(s => {
      const e = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 10), mat(0xffffff, { roughness: 0.2 })); e.position.set(0.11 * s, 0.09, 0.12); head.add(e);
      const p = new THREE.Mesh(new THREE.SphereGeometry(0.034, 10, 8), mat(0x111111, { roughness: 0.2 })); p.position.set(0.12 * s, 0.1, 0.17); head.add(p);
    });
    const jaw = new THREE.Group(); jaw.position.set(0, -0.06, -0.06); head.add(jaw);
    const jm = new THREE.Mesh(new THREE.SphereGeometry(0.17, 14, 8), belly); jm.scale.set(1, 0.32, 1.15); jm.position.z = 0.17; jaw.add(jm);
    const tongue = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.01, 0.22), mat(0xd81b60)); tongue.position.set(0, -0.03, 0.34); head.add(tongue);
    return { group: g, segs, head, jaw, tongue };
  }
  function animateSnake(s, phase, amt, t) {
    s.segs.forEach((m, i) => m.position.x = Math.sin(phase * 0.6 + t * 1.5 - i * 0.7) * 0.16 * (0.25 + amt) * Math.min(1, 0.2 + i / 3));
    s.head.position.x = Math.sin(phase * 0.6 + t * 1.5 + 0.7) * 0.04 * (0.25 + amt);
    s.tongue.visible = Math.sin(t * 9) > 0.3;
  }
  // bật/tắt dạng rắn cho một nhân vật chibi: ẩn các phần người, hiện rắn (màu theo chỉ số 1..7)
  function setSnake(c, idx) {
    if (c.snk && c.snk.idx !== idx) { c.group.remove(c.snk.group); c.snk = null; }
    if (idx && !c.snk) { c.snk = makeSnake(SNAKE_COLORS[(idx - 1) % 7]); c.snk.idx = idx; c.group.add(c.snk.group); }
    c.group.children.forEach(ch => ch.visible = c.snk && ch === c.snk.group ? !!idx : !idx);
  }

  /* ================= Đồ uống ở quầy bar (cầm trên tay phải) ================= */
  // glass: 'pint' cốc bia, 'wine' ly vang có chân, 'cocktail' ly martini, 'rocks' ly whisky thấp, 'shot' ly shot, 'tall' ly cao
  // extra: trang trí trong/trên ly; alc: có cồn
  const DRINKS = [
    { name: 'Bia tươi', sub: 'Bia vàng ướp lạnh, bọt mịn', alc: true, glass: 'pint', color: 0xf2b632, op: 0.85, extra: ['foam'], tip: 'Bia làm khô miệng, nhớ uống xen nước lọc.' },
    { name: 'Vang đỏ', sub: 'Vang đỏ khô, ly có chân', alc: true, glass: 'wine', color: 0x7b1022, op: 0.92, extra: [], tip: 'Vang đỏ dễ làm ố răng, súc miệng nước lọc sau khi uống.' },
    { name: 'Whisky đá', sub: 'Whisky, một viên đá lớn', alc: true, glass: 'rocks', color: 0xc77d2a, op: 0.85, extra: ['bigice'], tip: 'Đừng nhai đá, dễ mẻ răng đó!' },
    { name: 'Tequila shot', sub: 'Một shot, kèm lát chanh', alc: true, glass: 'shot', color: 0xf5e6b8, op: 0.8, extra: ['lime'], tip: 'Chanh chua làm mềm men răng, đợi 30 phút rồi mới đánh răng.' },
    { name: 'Mojito', sub: 'Rum trắng, bạc hà, chanh, soda', alc: true, glass: 'tall', color: 0xc8f0c0, op: 0.7, ice: true, extra: ['mint', 'lime', 'straw:0x2e7d32'], tip: 'Bạc hà thơm miệng nhưng vẫn có cồn, uống chậm thôi.' },
    { name: 'Margarita', sub: 'Tequila, chanh, viền muối', alc: true, glass: 'cocktail', color: 0xd9ef9a, op: 0.8, extra: ['salt', 'lime'], tip: 'Đồ chua và có cồn, uống bằng ống hút sẽ đỡ hại men răng.' },
    { name: 'Blue Lagoon', sub: 'Vodka, blue curaçao, soda chanh', alc: true, glass: 'tall', color: 0x29b6f6, op: 0.75, ice: true, extra: ['orange', 'straw:0xffffff'], tip: 'Màu xanh có thể bám lưỡi một lúc, không sao đâu.' },
    { name: 'Martini', sub: 'Gin, vermouth, quả ô liu', alc: true, glass: 'cocktail', color: 0xeef3dc, op: 0.6, extra: ['olive'], tip: 'Cocktail mạnh, nhâm nhi từ từ.' },
    { name: 'Mocktail dâu', sub: 'Không cồn: dâu, chanh, soda', alc: false, glass: 'tall', color: 0xf06292, op: 0.8, ice: true, extra: ['berry', 'straw:0xffffff'], tip: 'Không cồn nhưng có đường, nhớ súc miệng nha.' }
  ];
  function makeDrink(d) {
    const g = new THREE.Group(), add = (geo, m, x, y, z, parent = g) => { const me = new THREE.Mesh(geo, m); me.position.set(x, y, z); parent.add(me); return me; };
    const glass = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.22, roughness: 0.05, depthWrite: false, side: THREE.DoubleSide });
    const liqM = new THREE.MeshStandardMaterial({ color: d.color, transparent: d.op < 1, opacity: d.op, roughness: 0.3 });
    const stem = h => { add(new THREE.CylinderGeometry(0.006, 0.006, h, 8), glass, 0, h / 2, 0); add(new THREE.CylinderGeometry(0.035, 0.035, 0.006, 16), glass, 0, 0.003, 0); };
    // mỗi kiểu ly: hình ly, chất lỏng (đáy ở gốc toạ độ để co theo chiều cao khi uống), độ cao miệng ly, chỗ tay cầm
    let liquid, top, r, grip;
    if (d.glass === 'wine') {
      stem(0.1); r = 0.06; top = 0.19;
      add(new THREE.SphereGeometry(r, 18, 10, 0, Math.PI * 2, Math.PI * 0.35, Math.PI * 0.65), glass, 0, 0.16, 0);
      const lg = new THREE.SphereGeometry(r * 0.94, 18, 8, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2); lg.translate(0, r * 0.94, 0);
      liquid = add(lg, liqM, 0, 0.16 - r * 0.94, 0); grip = 0.06;
    } else if (d.glass === 'cocktail') {
      stem(0.1); r = 0.08; top = 0.19;
      add(new THREE.CylinderGeometry(r, 0.005, 0.09, 20, 1, true), glass, 0, 0.145, 0);
      const lg = new THREE.CylinderGeometry(r * 0.85, 0.005, 0.075, 20); lg.translate(0, 0.0375, 0);
      liquid = add(lg, liqM, 0, 0.1, 0); grip = 0.06;
    } else {
      const S = { pint: [0.07, 0.06, 0.22], rocks: [0.07, 0.068, 0.1], shot: [0.035, 0.03, 0.07], tall: [0.065, 0.053, 0.24] }[d.glass];
      r = S[0]; top = S[2];
      add(new THREE.CylinderGeometry(r, S[1], top, 20, 1, true), glass, 0, top / 2, 0);
      add(new THREE.CylinderGeometry(S[1], S[1], d.glass === 'shot' || d.glass === 'rocks' ? 0.015 : 0.006, 20), glass, 0, 0.004, 0);
      const lg = new THREE.CylinderGeometry(r * 0.9, S[1] * 0.92, top * 0.78, 20); lg.translate(0, top * 0.39, 0);
      liquid = add(lg, liqM, 0, 0.008, 0); grip = top * 0.35;
      if (d.glass === 'pint') add(new THREE.TorusGeometry(0.045, 0.011, 8, 16, Math.PI), glass, r + 0.005, top * 0.5, 0).rotation.z = -Math.PI / 2;
    }
    if (d.ice) for (let i = 0; i < 3; i++) add(new THREE.BoxGeometry(0.03, 0.03, 0.03), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 }), Math.cos(i * 2.1) * r * 0.45, top * 0.72, Math.sin(i * 2.1) * r * 0.45).rotation.set(i, i * 2, 0);
    d.extra.forEach(e => {
      if (e.startsWith('straw')) add(new THREE.CylinderGeometry(0.007, 0.007, top + 0.12, 8), mat(+e.split(':')[1] || 0xffffff), r * 0.35, (top + 0.12) / 2 + 0.03, 0).rotation.z = -0.2;
      if (e === 'mint') [0, 1, 2].forEach(i => add(new THREE.SphereGeometry(0.018, 8, 6), mat(0x43a047), (i - 1) * 0.02, top * 0.86, 0.01));
      if (e === 'lime' || e === 'orange') add(new THREE.CylinderGeometry(0.03, 0.03, 0.008, 16), mat(e === 'lime' ? 0x9ccc65 : 0xffa726), r * 0.95, top * 0.97, 0).rotation.z = Math.PI / 2;
      if (e === 'berry') for (let i = 0; i < 5; i++) add(new THREE.SphereGeometry(0.012, 8, 6), mat(0xc2185b), Math.cos(i * 1.3) * 0.03, top * 0.2 + i * 0.03, Math.sin(i * 1.3) * 0.03);
      if (e === 'foam') { const f = add(new THREE.CylinderGeometry(r * 0.92, r * 0.9, 0.04, 20), mat(0xfffbef, { roughness: 0.9 }), 0, top * 0.78, 0, liquid); f.scale.y = 1; }
      if (e === 'bigice') add(new THREE.BoxGeometry(0.05, 0.05, 0.05), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, roughness: 0.1 }), 0, 0.045, 0).rotation.set(0.3, 0.6, 0);
      if (e === 'salt') { const s = add(new THREE.TorusGeometry(r, 0.006, 6, 32), mat(0xffffff, { roughness: 1 }), 0, top, 0); s.rotation.x = Math.PI / 2; }
      if (e === 'olive') { add(new THREE.SphereGeometry(0.016, 10, 8), mat(0x7cb342), 0.01, 0.13, 0); add(new THREE.CylinderGeometry(0.003, 0.003, 0.11, 6), mat(0x8d6e63), 0.02, 0.16, 0).rotation.z = -0.4; }
    });
    return { group: g, liquid, grip };
  }
  // cầm/bỏ đồ uống (k = chỉ số + 1, 0 là không cầm) trên tay phải của nhân vật chibi
  function holdDrink(c, k) {
    if (c.drink) { c.arms[1].remove(c.drink.group); c.drink = null; }
    c.drinkK = k;
    if (!k || !DRINKS[k - 1]) return;
    c.drink = makeDrink(DRINKS[k - 1]); c.drink.group.position.set(0, -0.37 - c.drink.grip, 0.07); c.arms[1].add(c.drink.group);
  }
  // tay cầm ly đưa ra trước, sip 0..1 là lúc nâng ly lên miệng
  function drinkPose(c, sip) {
    if (!c.drink) return;
    const a = c.arms[1]; a.rotation.x = -0.7 - 1.3 * sip;
    c.drink.group.rotation.set(-a.rotation.x - 0.5 * sip, 0, -a.rotation.z);
  }

  /* ================= Răng 16 (mô hình) ================= */
  function makeTooth() {
    const enamel = new THREE.MeshPhysicalMaterial({ color: 0xf7f4ec, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.15 });
    const dentin = mat(0xead9b8, { roughness: 0.5 });
    const geo = new THREE.SphereGeometry(1, 64, 48), p = geo.attributes.position, v = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      const th = Math.atan2(v.z, v.x), r = Math.hypot(v.x, v.z);
      let y = v.y, sx = 1.12, sz = 1;
      if (y > 0) y = y * 0.62 + Math.pow(y, 3) * 0.16 * (0.5 + 0.5 * Math.cos(4 * th + 0.4)) - 0.22 * Math.exp(-(r * r) / 0.09) * y;
      else { const k = 1 - 0.22 * -y; sx *= k; sz *= k; y *= 0.55; }
      p.setXYZ(i, v.x * sx, y, v.z * sz);
    }
    geo.computeVertexNormals();
    const t = new THREE.Group();
    const crown = new THREE.Mesh(geo, enamel); crown.castShadow = true; t.add(crown);
    const rootGeo = new THREE.CylinderGeometry(0.34, 0.07, 1.9, 24, 12), rp = rootGeo.attributes.position;
    for (let i = 0; i < rp.count; i++) { v.fromBufferAttribute(rp, i); const k = (0.95 - v.y) / 1.9; rp.setX(i, v.x + 0.18 * k * k); }
    rootGeo.computeVertexNormals(); rootGeo.translate(0, -0.95, 0);
    [[0.38, 0.25, 0], [-0.38, 0.25, Math.PI], [0, -0.34, Math.PI / 2]].forEach(([x, z, ry]) => {
      const m = new THREE.Mesh(rootGeo, dentin); m.position.set(x, -0.55, z); m.rotation.y = ry; m.rotation.z = x ? 0.12 * Math.sign(x) : 0; m.castShadow = true; t.add(m);
    });
    return t;
  }

  /* ================= Biển tên (sprite) ================= */
  const signs = [];
  function makeSign(title, sub, color = '#0F7C86') {
    const c = document.createElement('canvas'); c.width = 640; c.height = sub ? 220 : 140;
    const x = c.getContext('2d'), r = 46, w = c.width, h = c.height;
    x.beginPath(); x.moveTo(r, 0); x.arcTo(w, 0, w, h, r); x.arcTo(w, h, 0, h, r); x.arcTo(0, h, 0, 0, r); x.arcTo(0, 0, w, 0, r); x.closePath();
    x.fillStyle = '#ffffff'; x.fill(); x.lineWidth = 10; x.strokeStyle = color; x.stroke();
    x.textAlign = 'center'; x.fillStyle = '#0E2A33';

  function teamInit() {
    const grid = $('docs'), det = $('docd'), tags = $('doc-tags');
    let open = -1;
    const show = i => {
      grid.querySelectorAll('.doc').forEach(b => b.setAttribute('aria-expanded', +b.dataset.i === i));
      if (i < 0) { det.hidden = true; return; }
      const d = DOCS[i];
      det.innerHTML = `<header><b>${d.n}</b><small>${d.role}${d.yrs ? ' · ' + d.yrs + ' năm kinh nghiệm' : ''}</small></header>
        <blockquote>“${d.q}”</blockquote><ul>${d.pts.map(p => `<li>${p}</li>`).join('')}</ul>
        <a href="${SITE}${d.slug}/" target="_blank" rel="noopener">Xem hồ sơ đầy đủ</a>`;
      det.hidden = false; grid.querySelector(`[data-i="${i}"]`).after(det);
    };
    grid.onclick = e => { const b = e.target.closest('.doc'); if (!b) return; open = open === +b.dataset.i ? -1 : +b.dataset.i; show(open); };
    tags.onclick = e => {
      const b = e.target.closest('[data-tag]'); if (!b) return;
      tags.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
      grid.querySelectorAll('.doc').forEach(c => c.hidden = b.dataset.tag !== 'all' && !DOCS[+c.dataset.i].tags.includes(b.dataset.tag));
      open = -1; show(-1);
    };
  }

    tmp.x = Math.max(-W + 0.4, Math.min(W - 0.4, tmp.x)); tmp.z = Math.max(-D + 0.4, Math.min(D - 0.4, tmp.z)); tmp.y = Math.min(CEIL - 0.4, tmp.y);
    camera.position.lerp(tmp, 1 - Math.exp(-dt * 6));
    lookAt.set(pos.x - Math.sin(camYaw) * 2.2, 1.25 + pos.y, pos.z - Math.cos(camYaw) * 2.2);
    camera.lookAt(lookAt);
    signs.forEach(s => { s.material.opacity = Math.max(0, Math.min(1, (s.position.distanceTo(camera.position) - 3.5) / 3)); });

    let best = null, bd = 2.2;
    zones.forEach(z => { const d = Math.hypot(pos.x - z.pos[0], pos.z - z.pos[1]); if (d < bd) { bd = d; best = z; } });
    if (best !== near) { near = best; $('hudZone').textContent = `${fl(cur.n)} · ${near ? near.name : 'Sảnh'}`; if (!near && openZone) closePanel(); }
    $('prompt').hidden = !near || !!openZone;
    if (near && !openZone) $('promptText').textContent = `${near.name} · ${near.sub}`;

    renderer.render(world, camera);
    netTick(now, dt, t, pos);
    bubbles.forEach(({ z, el }) => {
      const c = z.npc.group.position, show = z.floor === cur.n && Math.hypot(pos.x - c.x, pos.z - c.z) < 4.5 && !openZone;
      el.hidden = !show; if (!show) return;
      tmp.set(c.x, 2.1, c.z).project(camera);
      el.style.left = (tmp.x * 0.5 + 0.5) * innerWidth + 'px'; el.style.top = (-tmp.y * 0.5 + 0.5) * innerHeight + 'px';
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
